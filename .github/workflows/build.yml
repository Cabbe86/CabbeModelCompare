name: Build Revit Add-in (2025, 2026 & 2027)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for Revit ${{ matrix.revit_version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - revit_version: '2025'
            dotnet_version: '8.0.x'
            target_framework: 'net8.0-windows7.0'
          - revit_version: '2026'
            dotnet_version: '8.0.x'
            target_framework: 'net8.0-windows7.0'
          - revit_version: '2027'
            dotnet_version: '10.0.x'
            target_framework: 'net10.0-windows7.0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet_version }}

    - name: Restore dependencies
      run: dotnet restore src/CabbeModelCompare/CabbeModelCompare.csproj /p:RevitVersion=${{ matrix.revit_version }}

    - name: Build Add-in (Release)
      run: dotnet build src/CabbeModelCompare/CabbeModelCompare.csproj -c Release /p:RevitVersion=${{ matrix.revit_version }} --no-restore

    - name: Package installer files
      shell: bash
      run: |
        mkdir -p output/Revit${{ matrix.revit_version }}
        cp src/CabbeModelCompare/bin/Release/${{ matrix.target_framework }}/CabbeModelCompare_${{ matrix.revit_version }}.dll output/Revit${{ matrix.revit_version }}/CabbeModelCompare.dll
        cp src/CabbeModelCompare/CabbeModelCompare.addin output/Revit${{ matrix.revit_version }}/CabbeModelCompare.addin
        cp src/Install-Addin.bat output/Revit${{ matrix.revit_version }}/Install-Addin.bat

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: CabbeModelCompare-Revit-${{ matrix.revit_version }}
        path: output/Revit${{ matrix.revit_version }}

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Zip Files
      run: |
        mkdir -p release-zips
        cd artifacts
        for folder in CabbeModelCompare-Revit-*; do
          zip -j "../release-zips/${folder}.zip" "$folder"/*
        done
        cd ..
        ls -la release-zips/

    - name: Upload Zip Assets to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        files: release-zips/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
